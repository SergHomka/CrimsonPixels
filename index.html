<style>
  :root {
    --bg: #07070c;
    --frame-hi: #3a3a4d;
    --frame-mid: #1b1b26;
    --frame-lo: #0e0e15;
    --text: #8c8fa3;
    --led: #d12a2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    font-family: "Courier New", monospace;

    -webkit-user-select: none;

    position: absolute; left: 50%; top: 50%;

    width: 940px; margin: 0 auto; padding: 20px 20px 14px;

  .glass {

      linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,0) 28%),

    box-shadow: inset 0 0 40px rgba(0,0,0,.7);
    border-radius: 28px;

<body>
<div id="stage">
  <div id="tv">
    <div id="screenwrap">
      <canvas id="screen" width="900" height="600" tabindex="0"></canvas>
      <div class="scan"></div>
      <div class="glass"></div>
    </div>
    <div class="brand">
      <div><span class="led"></span>PIXTRON 8</div>
      <div class="knobs"><span></span><span></span></div>
    </div>
  </div>
  <p id="help"><b>Стрелки / WASD</b> — ходить &nbsp;·&nbsp; <b>Пробел / Z / мышь</b> — стрелять &nbsp;·&nbsp; <b>Shift</b> — целиться по ходу &nbsp;·&nbsp; <b>P</b> — пауза &nbsp;·&nbsp; <b>M</b> — звук</p>

<script>
'use strict';
(() => {
// ============ CORE ============
const W = 450, H = 300;
const cv = document.getElementById('screen');
const out = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const g = buf.getContext('2d');
const ground = document.createElement('canvas'); ground.width = W; ground.height = H;
const gr = ground.getContext('2d');
out.imageSmoothingEnabled = g.imageSmoothingEnabled = gr.imageSmoothingEnabled = false;

// 16-colour palette
const PAL = {
  K:'#0f0f1b', D:'#3b2a1e', B:'#6b4a2b', T:'#a87a45', S:'#d9b56b',
  G:'#2d5a27', g:'#5fa53a', l:'#a3d65c', r:'#7a1616', R:'#d12a2a',
  O:'#f25f3a', Y:'#ffd84a', W:'#f4f4f4', A:'#8c8fa3', U:'#4f7fd6', P:'#7b3fa0'
};
const col = c => PAL[c] || c;
const rr = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let seed = 1337;
const srand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const Q = Math.PI / 8;
const quant = a => Math.round(a / Q) * Q;

// ============ 3x5 BITMAP FONT ============
const FONT = {
  A:'010101111101101', B:'110101110101110', C:'011100100100011', D:'110101101101110',
  E:'111100110100111', F:'111100110100100', G:'011100101101011', H:'101101111101101',
  I:'111010010010111', J:'001001001101010', K:'101101110101101', L:'100100100100111',
  M:'101111111101101', N:'110101101101101', O:'010101101101010', P:'110101110100100',
  Q:'010101101111011', R:'110101110101101', S:'011100010001110', T:'111010010010010',
  U:'101101101101111', V:'101101101101010', W:'101101111111101', X:'101101010101101',
  Y:'101101010010010', Z:'111001010100111',
  0:'111101101101111', 1:'010110010010111', 2:'110001010100111', 3:'110001010001110',
  4:'101101111001001', 5:'111100110001110', 6:'011100111101111', 7:'111001010010010',
  8:'111101111101111', 9:'111101111001110',
  '.':'000000000000010', ',':'000000000010100', ':':'000010000010000', '-':'000000111000000',
  '!':'010010010000010', '?':'110001010000010', '/':'001001010100100', '+':'000010111010000',
  '>':'100010001010100', '<':'001010100010001', "'":'010010000000000', '%':'101001010100101'
};
const CYR = {
  'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','Х':'X','У':'Y','З':'3',
  'Б':'111100110101110', 'Г':'111100100100100', 'Л':'011101101101101', 'П':'111101101101101',
  'Ч':'101101011001001', 'Ь':'100100110101110', 'Э':'110001011001110', 'Я':'011101011101101',
  'Д':'0111001010010101111110001', 'Ж':'1010110101011101010110101', 'И':'1000110011101011100110001',
  'Й':'0101010011101011100110001', 'Ф':'0111010101101010111000100', 'Ц':'1001010010100101111100001',
  'Ш':'1010110101101011010111111', 'Щ':'1010110101101011111100001', 'Ъ':'1100001000011100100101110',
  'Ы':'1000110001110011010111001', 'Ю':'1001010101111011010110010'
};
for (const k in CYR) FONT[k] = CYR[k].length === 1 ? FONT[CYR[k]] : CYR[k];
const gw = ch => FONT[ch] ? FONT[ch].length / 5 : 3;
const tw = (s, sc) => { let w = -1; for (const ch of s) w += gw(ch) + 1; return w * sc; };
function drawT(c, s, x, y, colr, sc) {
  c.fillStyle = colr;
  for (const ch of s) {
    const gl = FONT[ch], w = gw(ch);
    if (gl) for (let i = 0; i < gl.length; i++) if (gl[i] === '1') c.fillRect(x + (i % w) * sc, y + ((i / w) | 0) * sc, sc, sc);
    x += (w + 1) * sc;
  }
}
function text(c, s, x, y, colr, sc = 1, al = 'l', sh = true) {
  s = String(s).toUpperCase();
  while (sc > 1 && tw(s, sc) > W - 12) sc--;
  const w = tw(s, sc);
  if (al === 'c') x -= w >> 1; else if (al === 'r') x -= w;
  x = Math.round(x); y = Math.round(y);
  if (sh) { const o = Math.ceil(sc / 2); drawT(c, s, x + o, y + o, PAL.K, sc); }
  drawT(c, s, x, y, col(colr), sc);
}
function wrap(s, maxPx) {
  const lines = []; let cur = '';
  for (const w of String(s).toUpperCase().split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (tw(t, 1) > maxPx && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ============ SPRITE HELPERS ============
const mk = (w, h, fn) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false; fn(x); return c;
};
const px = (x, X, Y, c, w = 1, h = 1) => { x.fillStyle = col(c); x.fillRect(X, Y, w, h); };
const disc = (x, cx, cy, r, c) => {
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (i * i + j * j <= r * r + r * .5) px(x, cx + i, cy + j, c);
};
const line = (x, x0, y0, x1, y1, c) => {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
  for (let i = 0; i <= n; i++) px(x, Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), c);
};
const tint = (img, rgba) => mk(img.width, img.height, x => {
  x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-atop';
  x.fillStyle = rgba; x.fillRect(0, 0, img.width, img.height);
});
function spr(c, img, x, y, ang = 0, sc = 1) {
  c.save(); c.translate(Math.round(x), Math.round(y));
  if (ang) c.rotate(quant(ang));
  if (sc !== 1) c.scale(sc, sc);
  c.drawImage(img, -(img.width >> 1), -(img.height >> 1)); c.restore();
}
function glyph(x, ch, X, Y, c) { drawT(x, ch, X, Y, col(c), 1); }

// ---- hero (faces right) ----
const heroS = mk(16, 16, x => {
  px(x, 5, 3, 'K', 7, 10);
  px(x, 6, 4, 'U', 5, 8);
  px(x, 4, 5, 'B', 3, 6);
  disc(x, 8, 8, 2, 'T');
  px(x, 6, 6, 'R', 2, 5);
  px(x, 3, 9, 'R', 3, 1);
  px(x, 10, 5, 'U', 4, 1); px(x, 10, 10, 'U', 4, 1);
  px(x, 13, 6, 'T', 1, 2); px(x, 13, 9, 'T');
  px(x, 11, 7, 'K', 5, 2); px(x, 14, 7, 'A', 2, 1);
});
// ---- enemies (face right, 2 walk frames each) ----
const zombieF = [0, 1].map(f => mk(16, 16, x => {
  disc(x, 7, 8, 5, 'K'); disc(x, 7, 8, 4, 'G');
  px(x, 4, 6, 'B', 3, 5);
  disc(x, 8, 8, 3, 'g');
  px(x, 10, 7, 'R'); px(x, 10, 9, 'R');
  px(x, 11 + f, 3, 'g', 4, 2); px(x, 11 + (1 - f), 11, 'g', 4, 2);
  px(x, 14 + f, 3, 'l'); px(x, 14 + (1 - f), 12, 'l');
}));
const spiderF = [0, 1].map(f => mk(16, 16, x => {
  for (let i = 0; i < 4; i++) {
    const bx = 4 + i * 2, o = (i + f) % 2, dx = (i - 1.5) * 1.6;
    line(x, bx, 6, bx + dx, 1 + o, 'K'); line(x, bx, 9, bx + dx, 14 - o, 'K');
  }
  disc(x, 6, 8, 3, 'P'); disc(x, 10, 8, 2, 'K');
  px(x, 5, 8, 'R', 2, 1); px(x, 11, 7, 'R'); px(x, 11, 9, 'R');
}));
const lizardF = [0, 1].map(f => mk(20, 20, x => {
  px(x, 0, 9, 'r', 5, 2); px(x, 1, 8, 'O');
  px(x, 6 + f, 3, 'r', 4, 2); px(x, 6 + (1 - f), 15, 'r', 4, 2);
  px(x, 12 + (1 - f), 3, 'r', 4, 2); px(x, 12 + f, 15, 'r', 4, 2);
  disc(x, 9, 10, 5, 'K'); disc(x, 9, 10, 4, 'R');
  px(x, 6, 10, 'O', 5, 1);
  disc(x, 14, 10, 3, 'K'); disc(x, 14, 10, 2, 'O');
  px(x, 15, 8, 'Y'); px(x, 15, 12, 'Y'); px(x, 17, 10, 'O', 2, 1);
}));
const bruteF = [0, 1].map(f => mk(30, 30, x => {
  px(x, 15 + f, 3, 'r', 9, 5); px(x, 23 + f, 3, 'T', 4, 5);
  px(x, 15 + (1 - f), 22, 'r', 9, 5); px(x, 23 + (1 - f), 22, 'T', 4, 5);
  disc(x, 14, 15, 11, 'K'); disc(x, 14, 15, 10, 'r');
  px(x, 6, 8, 'D', 3, 14); px(x, 11, 6, 'D', 2, 18);
  disc(x, 21, 15, 5, 'K'); disc(x, 21, 15, 4, 'T');
  px(x, 24, 12, 'Y'); px(x, 24, 18, 'Y');
  px(x, 22, 9, 'W', 3, 2); px(x, 22, 20, 'W', 3, 2);
}));
const D = 'rgba(15,15,27,.5)', WH = 'rgba(255,255,255,.85)';
const enemyArt = (fr) => ({ spr: fr, dead: tint(fr[0], D), sil: fr.map(i => tint(i, WH)) });
const ART = {
  zombie: enemyArt(zombieF), spider: enemyArt(spiderF),
  lizard: enemyArt(lizardF), brute: enemyArt(bruteF)
};
const heroDead = tint(heroS, D), heroSil = tint(heroS, WH);
const heroOut = (() => {
  const sil = tint(heroS, '#ffffff');
  return mk(18, 18, x => { for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) x.drawImage(sil, 1 + dx, 1 + dy); });
})();
// ---- AI-era enemies ----
const botF = [0, 1].map(f => mk(12, 12, x => {
  px(x, 1 + f, 0, 'K', 2, 2); px(x, 1 + (1 - f), 10, 'K', 2, 2);
  px(x, 8 + f, 0, 'K', 2, 2); px(x, 8 + (1 - f), 10, 'K', 2, 2);
  px(x, 2, 2, 'K', 8, 8); px(x, 3, 3, 'A', 6, 6);
  px(x, 7, 4, 'U', 2, 4); px(x, 8, 5, 'W'); px(x, 3, 3, 'R');
}));
const agiImg = mk(46, 46, x => {
  disc(x, 23, 23, 21, 'K'); disc(x, 23, 23, 19, 'P');
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; line(x, 23 + Math.cos(a) * 12, 23 + Math.sin(a) * 12, 23 + Math.cos(a) * 18, 23 + Math.sin(a) * 18, 'U'); }
  disc(x, 23, 23, 13, 'K'); disc(x, 23, 23, 12, 'U');
  disc(x, 25, 23, 8, 'K'); disc(x, 25, 23, 7, 'W');
  disc(x, 28, 23, 4, 'R'); px(x, 29, 22, 'Y', 2, 2);
});
const droneS = mk(9, 9, x => {
  px(x, 0, 0, 'W', 2, 1); px(x, 7, 0, 'W', 2, 1); px(x, 0, 8, 'W', 2, 1); px(x, 7, 8, 'W', 2, 1);
  disc(x, 4, 4, 3, 'K'); disc(x, 4, 4, 2, 'A'); px(x, 5, 3, 'U', 2, 3); px(x, 6, 4, 'W');
});
const orbS = mk(5, 5, x => { disc(x, 2, 2, 2, 'R'); px(x, 1, 1, 'Y', 2, 2); });
ART.ghost = { spr: lizardF.map(i => tint(i, 'rgba(120,230,255,.7)')), dead: null, sil: lizardF.map(i => tint(i, WH)) };
ART.deepfake = { spr: [tint(heroS, 'rgba(210,70,230,.6)'), tint(heroS, 'rgba(240,120,255,.6)')], dead: tint(heroDead, 'rgba(210,70,230,.3)'), sil: [heroSil, heroSil] };
ART.bot = enemyArt(botF);
ART.agi = { spr: [agiImg, agiImg], dead: tint(agiImg, D), sil: [tint(agiImg, WH), tint(agiImg, WH)] };

// ---- bullets ----
const bulletS = mk(7, 3, x => { px(x, 0, 1, 'O', 2, 1); px(x, 2, 1, 'Y', 3, 1); px(x, 5, 0, 'Y', 1, 3); px(x, 6, 1, 'W'); });
const pelletS = mk(3, 3, x => { px(x, 1, 0, 'Y', 1, 3); px(x, 0, 1, 'Y', 3, 1); px(x, 1, 1, 'W'); });
const plasmaS = mk(11, 7, x => { px(x, 0, 3, 'U', 3, 1); px(x, 2, 2, 'U', 7, 3); px(x, 3, 3, 'W', 6, 1); px(x, 4, 1, 'U', 4, 1); px(x, 4, 5, 'U', 4, 1); px(x, 9, 3, 'W', 2, 1); });
// ============ LANGUAGE ============
const I18N = {
  ru: {
    title: 'Багровые пиксели 8-bit', t1: 'БАГРОВЫЕ', t2: 'ПИКСЕЛИ', sub: 'ШУТЕР НА ВЫЖИВАНИЕ В 8 БИТ',
    start: 'НАЖМИ ПРОБЕЛ ДЛЯ СТАРТА',
    ctl1: 'СТРЕЛКИ/WASD - ХОДИТЬ      ПРОБЕЛ/Z/МЫШЬ - ОГОНЬ',
    ctl2: 'P - ПАУЗА    M - ЗВУК    SHIFT - ЦЕЛИТЬСЯ ПО ХОДУ    E - ЗАМЕДЛЕНИЕ',
    ctl3: 'T - ТОП 10    H - ПОМОЩЬ    L - ENGLISH',
    h_title: 'ПОМОЩЬ', h_nav: 'СТРЕЛКИ - ЛИСТАТЬ    ESC - НАЗАД', h_pause: 'H - ПОМОЩЬ',
    h_pages: ['КАК ИГРАТЬ И БОНУСЫ', 'ВРАГИ', 'ПЕРКИ 1 ИЗ 2', 'ПЕРКИ 2 ИЗ 2'],
    h_intro: 'СТРЕЛКИ ИЛИ WASD - ХОДИТЬ. ПРОБЕЛ, Z ИЛИ МЫШЬ - СТРЕЛЯТЬ. ЦЕЛИТСЯ ИГРА САМА, ЛИБО ВЕДИ МЫШЬЮ. SHIFT - ЦЕЛИТЬСЯ ТУДА, КУДА ИДЕШЬ. E - ЗАМЕДЛЕНИЕ ВРЕМЕНИ, ЕСЛИ ВЗЯЛ ПЕРК РАССУЖДЕНИЕ. P - ПАУЗА, M - ЗВУК, L - ЯЗЫК.',
    h_goal: 'ЦЕЛЬ: ВЫЖИТЬ КАК МОЖНО ДОЛЬШЕ. УБИВАЙ ВРАГОВ, КОПИ ОПЫТ, НА КАЖДОМ НОВОМ УРОВНЕ ВЫБИРАЙ ПЕРК. КАЖДЫЕ 10 ВОЛН ПРИХОДИТ БОСС AGI. ИЗ ВРАГОВ ИНОГДА ВЫПАДАЮТ БОНУСЫ:',
    h_bon: {
      smg: ['АВТОМАТ', 'ОЧЕНЬ БЫСТРАЯ СТРЕЛЬБА, 140 ПАТРОНОВ'],
      shotgun: ['ДРОБОВИК', '7 ДРОБИНОК ЗА ВЫСТРЕЛ, ХОРОШ ВБЛИЗИ, 28 ПАТРОНОВ'],
      plasma: ['ПЛАЗМА', 'ЗАРЯД ПРОБИВАЕТ ДО 4 ВРАГОВ, 60 ПАТРОНОВ'],
      medkit: ['АПТЕЧКА', 'ЛЕЧИТ 35 ЗДОРОВЬЯ'],
      shield: ['ЩИТ', '8 СЕКУНД НЕУЯЗВИМОСТИ'],
      speed: ['УСКОРЕНИЕ', '8 СЕКУНД БЕГА НА 50% БЫСТРЕЕ'],
      nuke: ['ЯДЕРКА', '220 УРОНА ВСЕМ НА ЭКРАНЕ, СТИРАЕТ ПУЛИ ВРАГОВ'],
      agent: ['РЕЖИМ АГЕНТА', '10 СЕКУНД ГЕРОЙ ИГРАЕТ САМ: УВОРАЧИВАЕТСЯ И СТРЕЛЯЕТ']

// ============ GROUND ============
function makeGround() {
  seed = 1337;
  const gw = 16, gh = 11, grid = [];
  for (let i = 0; i < (gw + 1) * (gh + 1); i++) grid.push(srand());
  const sample = (X, Y) => {
    const fx = Math.min(X, W - 1) / W * gw, fy = Math.min(Y, H - 1) / H * gh;
    const i = fx | 0, j = fy | 0, u = fx - i, v = fy - j, s = gw + 1;
    const a = grid[j * s + i], b = grid[j * s + i + 1], c = grid[(j + 1) * s + i], d = grid[(j + 1) * s + i + 1];
    return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
  };
  const bayer = [[0, .5], [.75, .25]], ramp = ['D', 'B', 'T', 'S'];
  gr.globalAlpha = 1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = sample(x, y) * 2.3 + .55 + bayer[y & 1][x & 1] - .25 + (srand() - .5) * .25;
    px(gr, x, y, ramp[clamp(Math.floor(t), 0, 3)]);
  }
  // cracks
  for (let n = 0; n < 12; n++) {
    let x = srand() * W, y = srand() * H, a = srand() * 6.28;
    for (let s = 0; s < 22; s++) { px(gr, Math.round(x), Math.round(y), 'D'); a += (srand() - .5) * .9; x += Math.cos(a) * 1.4; y += Math.sin(a) * 1.4; }
  }
  // old dried blood
  gr.globalAlpha = .35;
  for (let n = 0; n < 7; n++) { const x = srand() * W, y = srand() * H; for (let k = 0; k < 6; k++) disc(gr, Math.round(x + (srand() - .5) * 14), Math.round(y + (srand() - .5) * 10), 1 + (srand() * 3 | 0), 'r'); }
  gr.globalAlpha = 1;
  // grass tufts
  for (let n = 0; n < 46; n++) {
    const cx = srand() * W, cy = srand() * H;
    for (let k = 0; k < 4; k++) { const bx = Math.round(cx + (srand() - .5) * 7), by = Math.round(cy + (srand() - .5) * 4); px(gr, bx, by, 'G', 1, 2); px(gr, bx, by - 1, srand() < .5 ? 'g' : 'l'); }
  }
  // rocks with shadows
  for (let n = 0; n < 14; n++) {
    const x = Math.round(srand() * W), y = Math.round(srand() * H), r = 2 + (srand() * 2 | 0);
    gr.globalAlpha = .3; px(gr, x - r, y + r, 'K', r * 2 + 2, 2); gr.globalAlpha = 1;
    disc(gr, x, y, r, 'K'); disc(gr, x, y, r - 1, 'A'); px(gr, x - 1, y - 1, 'W');
  }
  // bones and skulls
  for (let n = 0; n < 9; n++) {
    const x = Math.round(srand() * W), y = Math.round(srand() * H);
    line(gr, x, y, x + 5, y + (srand() * 4 | 0) - 2, 'W'); px(gr, x - 1, y, 'W'); px(gr, x + 5, y - 1, 'W');
  }
  for (let n = 0; n < 5; n++) {
    const x = Math.round(srand() * W), y = Math.round(srand() * H);
    disc(gr, x, y, 2, 'W'); px(gr, x - 1, y, 'K'); px(gr, x + 1, y, 'K'); px(gr, x, y + 2, 'A', 1, 1);
  }
  // edge vignette
  for (const [x0, y0, x1, y1, w, h] of [[0, 0, 0, 40, W, 40], [0, H, 0, H - 40, W, 40], [0, 0, 40, 0, 40, H], [W, 0, W - 40, 0, 40, H]]) {
    const gd = gr.createLinearGradient(x0, y0, x1, y1);
    gd.addColorStop(0, 'rgba(15,15,27,.5)'); gd.addColorStop(1, 'rgba(15,15,27,0)');
    gr.fillStyle = gd; gr.fillRect(x0 === W ? W - 40 : x0, y0 === H ? H - 40 : y0, w, h);
  }
}

// ============ AUDIO ============
let ac = null, muted = false, nbuf = null;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function tone(f, d, type = 'square', v = .06, slide = 0, delay = 0) {
  if (!ac || muted) return;
  const t0 = ac.currentTime + delay, o = ac.createOscillator(), gn = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t0 + d);
  gn.gain.setValueAtTime(v, t0); gn.gain.exponentialRampToValueAtTime(.001, t0 + d);
  o.connect(gn); gn.connect(ac.destination); o.start(t0); o.stop(t0 + d + .02);
}
function noise(d, v = .08, delay = 0, hp = 0) {
  if (!ac || muted || !nbuf) return;
  const t0 = ac.currentTime + delay, s = ac.createBufferSource(), gn = ac.createGain();
  s.buffer = nbuf; gn.gain.setValueAtTime(v, t0); gn.gain.exponentialRampToValueAtTime(.001, t0 + d);
  let n = s;
  if (hp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = hp; s.connect(f); n = f; }
  n.connect(gn); gn.connect(ac.destination); s.start(t0); s.stop(t0 + d + .02);
}

const keys = {}, hit = new Set();
const mouse = { x: W / 2, y: H / 2, down: false, last: -1e9 };
const BLOCK = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'PageUp', 'PageDown'];
const typed = [];
window.addEventListener('keydown', e => {
  if (BLOCK.includes(e.code)) e.preventDefault();
  if (scene === 'name') {
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { typed.push(e.key); e.preventDefault(); }
    else if (e.key === 'Backspace') e.preventDefault();
  }
  initAudio();
  if (!e.repeat) hit.add(e.code);
  keys[e.code] = true;
}, { passive: false });
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (scene === 'play') scene = 'pause'; });
function mpos(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width * W; mouse.y = (e.clientY - r.top) / r.height * H;
  mouse.last = performance.now();
}
cv.addEventListener('mousemove', mpos);
cv.addEventListener('mousedown', e => { initAudio(); mpos(e); mouse.down = true; hit.add('Click'); cv.focus(); e.preventDefault(); });

function stamp(img, x, y, ang, alpha = 1) {
  if (!img) return;

  gr.drawImage(img, -(img.width >> 1), -(img.height >> 1)); gr.restore();
}
function pool(x, y, c, n, rad) {
  gr.globalAlpha = .8;
  for (let i = 0; i < n; i++) disc(gr, Math.round(x + rr(-rad, rad)), Math.round(y + rr(-rad, rad)), ri(1, 3), c);
  gr.globalAlpha = 1;
}
function blood(x, y, c, n, dirx = 0, diry = 0, sp = 70) {
  for (let i = 0; i < n; i++) {
    const a = rr(0, 6.28), s = rr(10, sp);
    parts.push({ x, y, vx: Math.cos(a) * s + dirx * .4, vy: Math.sin(a) * s + diry * .4, life: rr(.25, .6), c, blood: true });
  }
}
function spark(x, y, c, n) {
  for (let i = 0; i < n; i++) { const a = rr(0, 6.28), s = rr(20, 90); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rr(.15, .4), c, blood: false }); }
}
function floater(x, y, s, c = 'W') { floats.push({ x, y, s, c, life: 1 }); }
function notice(s, t = 3) { noticeS = s; noticeT = t; }
function nearest(x, y, maxD, skipGhost = true) {

    if (e.dead || (skipGhost && e.ghost) || e.x < 0 || e.x > W || e.y < 0 || e.y > H) continue;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2; if (d < best2) { best2 = d; r = e; }
  }

}

function spawnEnemy(type, x, y) {
  const T = ETYPE[type], sc = type === 'agi' ? 1 + wave * .06 : 1 + wave * .09 + wave * wave * .004;
  const e = {
    type, x, y, hp: T.hp * sc, max: T.hp * sc, spd: T.spd * (1 + Math.min(wave * .035, .75)) * rr(.9, 1.1),
    dmg: T.dmg * (1 + wave * .04), r: T.r, ang: 0, anim: rr(0, 2), atkT: 0, hitT: 0, wob: rr(0, 6.28), art: ART[type], age: 0

  if (type === 'deepfake') e.blinkT = rr(1, 2.2);
  if (type === 'agi') { e.boss = true; e.phase = 1; e.shootT = 3; e.summonT = 2; e.spd = T.spd; }
  enemies.push(e); return e;
}
function edgePos() {
  const s = ri(0, 3), m = 14;
  return s === 0 ? [rr(0, W), -m] : s === 1 ? [W + m, rr(0, H)] : s === 2 ? [rr(0, W), H + m] : [-m, rr(0, H)];
}
const countType = t => { let n = 0; for (const e of enemies) if (e.type === t) n++; return n; };
function spawnGroup() {
  const wts = [['zombie', 6], ['spider', wave >= 2 ? 2 + wave * .4 : 0], ['lizard', wave >= 3 ? 1 + wave * .35 : 0],
    ['bot', wave >= 3 ? 1.5 + wave * .2 : 0], ['ghost', wave >= 4 ? .8 + wave * .12 : 0],
    ['brute', wave >= 5 ? .25 + (wave - 5) * .12 : 0], ['deepfake', wave >= 6 ? .5 + (wave - 6) * .1 : 0]];
  let tot = 0; for (const w of wts) tot += w[1];
  let r = Math.random() * tot, type = 'zombie';
  for (const w of wts) { if ((r -= w[1]) <= 0) { type = w[0]; break; } }
  if (type === 'ghost' && countType('ghost') >= 4) type = 'zombie';
  if (type === 'deepfake' && countType('deepfake') >= 1 + ((wave / 10) | 0)) type = 'lizard';
  if (type === 'ghost') {
    let x, y, tries = 0;
    do { x = rr(24, W - 24); y = rr(24, H - 24); } while (Math.hypot(x - P.x, y - P.y) < 90 && ++tries < 20);
    spawnEnemy(type, x, y); spark(x, y, 'U', 10); return 1;
  }
  const [x, y] = edgePos();
  if (type === 'spider') { const n = Math.min(3, spawnLeft); for (let i = 0; i < n; i++) spawnEnemy(type, x + rr(-10, 10), y + rr(-10, 10)); return n; }
  if (type === 'bot') { const n = Math.min(ri(5, 8), spawnLeft); for (let i = 0; i < n; i++) spawnEnemy(type, x + rr(-14, 14), y + rr(-14, 14)); return n; }
  spawnEnemy(type, x, y); return type === 'brute' ? Math.min(4, spawnLeft) : 1;
}
function startWave() {

  spawnGap = Math.max(.15, 1.0 - wave * .06); spawnT = boss ? 3 : 0; banner = 2.6; waveDelay = 2.6;

function ebShoot(x, y, a, spd, dmg) { ebul.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 5, dmg }); }
function bossAI(e, dt) {
  const f = e.hp / e.max, ph = f > .66 ? 1 : f > .33 ? 2 : 3;
  if (ph !== e.phase) { e.phase = ph; shake = 8; spark(e.x, e.y, 'W', 24); sfx('boss'); e.shootT = 1; }
  e.spd = ETYPE.agi.spd * (ph === 3 ? 2.2 : ph === 2 ? 1.5 : 1);
  e.summonT -= dt; e.shootT -= dt;
  if (e.summonT <= 0) {

  spr(g, heroS, W / 2, 152, -.3 + Math.sin(t) * .2, 3);
  const cast = [['zombie', 90, 160, 3.1, 2], ['spider', 150, 186, 3.0, 2], ['lizard', 310, 186, .1, 2], ['brute', 372, 156, .1, 2], ['bot', 330, 128, .1, 2], ['spider', 120, 128, 3.1, 1]];
  for (const [n, x, y, a, s] of cast) spr(g, ART[n].spr[((t * 4) | 0) % 2], x, y + Math.sin(t * 3 + x) * 2, a, s);
  if (((t * 2) | 0) % 2 === 0) text(g, tr('start'), W / 2, 208, 'W', 2, 'c');
  text(g, tr('ctl1'), W / 2, 236, 'S', 1, 'c');
  text(g, tr('ctl2'), W / 2, 246, 'S', 1, 'c');
  text(g, tr('ctl3'), W / 2, 256, 'S', 1, 'c');
  text(g, tr('tag'), W / 2, 272, 'A', 1, 'c');
  if (best) text(g, tr('best') + ' ' + best, W / 2, 286, 'Y', 1, 'c');
}
function drawName(t) {
  g.drawImage(ground, 0, 0); dim(.72);
  text(g, tr('name_t'), W / 2, 52, 'Y', 3, 'c');
  panel(W / 2 - 100, 100, 200, 30, true);
  const w = tw(nameBuf, 2);
  text(g, nameBuf, W / 2 - w / 2 - 3, 109, 'W', 2);
  if (((t * 2) | 0) % 2 === 0) { g.fillStyle = PAL.Y; g.fillRect(Math.round(W / 2 - w / 2 - 3 + w + 3), 108, 6, 12); }
  text(g, tr('name_hint'), W / 2, 146, 'A', 1, 'c');
  text(g, tr('name_h'), W / 2, 176, 'S', 1, 'c');
}
function drawTop(t) {
  g.drawImage(ground, 0, 0); dim(.75);
  text(g, tr('top'), W / 2, 16, 'Y', 5, 'c');
  panel(50, 60, 350, 190, false);
  drawTable(55, 68, 340, 18, 2, -1);
  text(g, tr('top_hint'), W / 2, 272, 'A', 1, 'c');
}
function drawHelp(t) {
  g.drawImage(ground, 0, 0); dim(.86);
  text(g, tr('h_title'), W / 2, 6, 'Y', 3, 'c');
  text(g, tr('h_pages')[helpPage], W / 2, 28, 'S', 1, 'c');
  let y = 42;
  if (helpPage === 0) {
    for (const l of wrap(tr('h_intro'), 426)) { text(g, l, 12, y, 'W'); y += 8; }
    y += 4;
    for (const l of wrap(tr('h_goal'), 426)) { text(g, l, 12, y, 'S'); y += 8; }
    y += 6;
    for (const k of ['smg', 'shotgun', 'plasma', 'medkit', 'shield', 'speed', 'nuke', 'agent']) {
      g.drawImage(BON[k].img, 12, y - 3);
      const [n, d] = tr('h_bon')[k];
      text(g, n, 32, y, 'Y'); text(g, d, 32 + tw(n, 1) + 8, y, 'W'); y += 16;
    }
  } else if (helpPage === 1) {
    for (const k of ['zombie', 'spider', 'lizard', 'bot', 'ghost', 'deepfake', 'brute', 'agi']) {
      spr(g, ART[k].spr[0], 26, y + 8, 0, k === 'agi' ? .5 : k === 'brute' ? .8 : k === 'bot' ? 1.5 : 1);
      const [n, d] = tr('h_en')[k], ls = wrap(d, 390);
      text(g, n, 46, y, 'Y');
      ls.forEach((l, i) => text(g, l, 46, y + 9 + i * 8, 'W'));
      y += Math.max(26, 13 + ls.length * 8);
    }
  } else {
    for (const c of helpPage === 2 ? PERKS.slice(0, 7) : PERKS.slice(7)) {
      text(g, pn(c), 12, y, 'Y');
      text(g, '- ' + pd(c), 12 + tw(pn(c), 1) + 8, y, 'S');
      const ls = wrap(PERK_HELP[c.n][lang === 'ru' ? 1 : 0], 426);
      ls.forEach((l, i) => text(g, l, 12, y + 9 + i * 8, 'W'));
      y += 9 + ls.length * 8 + 6;
    }
  }
  text(g, '< >  ' + (helpPage + 1) + '/4     ' + tr('h_nav'), W / 2, 288, 'A', 1, 'c');
}
function drawPerk(t) {
  dim(.7);
  text(g, tr('lvlup'), W / 2, 26, 'Y', 4, 'c');
  text(g, tr('choose'), W / 2, 54, 'W', 1, 'c');
  const cw = 130, gap = 12, x0 = (W - (cw * 3 + gap * 2)) / 2;
  choices.forEach((c, i) => {
    const x = Math.round(x0 + i * (cw + gap)), y = 96 + (i === perkSel ? -4 : 0);
    panel(x, y, cw, 100, i === perkSel);
    text(g, i + 1, x + cw / 2, y + 8, 'Y', 3, 'c');
    wrap(pn(c), 116).forEach((l, k) => text(g, l, x + cw / 2, y + 36 + k * 8, 'W', 1, 'c'));
    wrap(pd(c), 116).forEach((l, k) => text(g, l, x + cw / 2, y + 60 + k * 8, 'S', 1, 'c'));
  });
  if (real < lock) text(g, '...', W / 2, 214, 'A', 1, 'c');
}
function drawOver(t) {
  dim(.6);
  text(g, tr('over'), W / 2, 12, 'R', 5, 'c');
  text(g, overJoke, W / 2, 44, 'A', 1, 'c');
  const cx = 112;
  text(g, nick || tr('player'), cx, 66, 'Y', 1, 'c');
  text(g, tr('score') + ' ' + score, cx, 78, 'W', 2, 'c');
  if (myRank >= 0) text(g, myRank === 0 ? tr('record') : tr('rank') + ' ' + (myRank + 1) + '!', cx, 102, 'Y', 1, 'c');
  else text(g, tr('notop'), cx, 102, 'A', 1, 'c');
  text(g, tr('wave') + ' ' + wave + '  ' + tr('lvl') + ' ' + P.lvl + '  ' + tr('kills') + ' ' + kills, cx, 116, 'S', 1, 'c');
  if (myStats) text(g, tr('games') + ' ' + myStats.g + '  ' + tr('totalk') + ' ' + myStats.k, cx, 130, 'A', 1, 'c');
  text(g, tr('top'), 328, 60, 'Y', 1, 'c');
  panel(222, 70, 212, 98, false);
  drawTable(224, 74, 208, 9, 1, myRank);
  if (real > lock && ((t * 2) | 0) % 2 === 0) text(g, tr('again'), W / 2, 200, 'W', 2, 'c');
}
function render() {
  const t = real;
  if (scene === 'title') drawTitle(t);
  else if (scene === 'name') drawName(t);
  else if (scene === 'top') drawTop(t);
  else if (scene === 'help') drawHelp(t);
  else {
    drawWorld(time); drawHUD(time);
    if (P.slowT > 0) { g.fillStyle = 'rgba(79,127,214,.16)'; g.fillRect(0, 0, W, H); }
    if (P.hp / P.max < .3 && !P.dead) { g.fillStyle = 'rgba(209,42,42,' + (.08 + .06 * Math.sin(time * 6)) + ')'; g.fillRect(0, 0, W, H); }
    if (redFlash > 0) { g.fillStyle = 'rgba(209,42,42,' + redFlash * .6 + ')'; g.fillRect(0, 0, W, H); }
    if (whiteFlash > 0) { g.fillStyle = 'rgba(255,255,255,' + whiteFlash * 1.6 + ')'; g.fillRect(0, 0, W, H); }
    if (scene === 'perk') drawPerk(t);
    else if (scene === 'pause') { dim(.6); text(g, tr('paused'), W / 2, 120, 'Y', 4, 'c'); text(g, tr('cont'), W / 2, 170, 'W', 1, 'c'); text(g, tr('h_pause'), W / 2, 186, 'S', 1, 'c'); }
    else if (scene === 'over') drawOver(t);
  }
  if (muted) text(g, tr('mute'), W - 8, H - 22, 'A', 1, 'r');
  const sh = scene === 'play' || scene === 'over' ? shake : 0;
  const sx = sh ? Math.round((Math.random() - .5) * sh) * 2 : 0, sy = sh ? Math.round((Math.random() - .5) * sh) * 2 : 0;
  out.fillStyle = '#000'; out.fillRect(0, 0, 900, 600);
  out.drawImage(buf, sx, sy, 900, 600);
}

// ============ MAIN LOOP ============
function nameInput() {
  for (const k of typed) {
    const ch = k.toUpperCase().replace('Ё', 'Е');
    if (/^[A-ZА-Я0-9 .\-]$/.test(ch) && nameBuf.length < 10) nameBuf += ch;
  }
  typed.length = 0;
  if (hit.has('Backspace')) nameBuf = nameBuf.slice(0, -1);
  if (hit.has('Escape')) scene = 'title';
  else if (hit.has('Enter') || hit.has('NumpadEnter')) {
    nick = nameBuf.trim(); lsSet(LS_NICK, nick); reset(); scene = 'play'; sfx('choose');
  }
}
function menuInput() {
  const go = hit.has('Space') || hit.has('Enter') || hit.has('Click') || hit.has('KeyZ');
  if (scene === 'name') { nameInput(); return; }
  if (scene === 'top') { if (hit.size) scene = 'title'; return; }
  if (scene === 'help') {
    if (hit.has('ArrowRight') || hit.has('KeyD') || hit.has('Space') || hit.has('Click')) helpPage = (helpPage + 1) % 4;
    if (hit.has('ArrowLeft') || hit.has('KeyA')) helpPage = (helpPage + 3) % 4;
    if (hit.has('Escape') || hit.has('KeyH') || hit.has('Enter') || hit.has('Backspace')) scene = helpFrom;
    if (hit.has('KeyL')) setLang(lang === 'ru' ? 'en' : 'ru');
    return;
  }
  if (scene === 'title') {
    if (go) { nameBuf = nick; typed.length = 0; scene = 'name'; }
    else if (hit.has('KeyT')) scene = 'top';
    else if (hit.has('KeyH')) { helpPage = 0; helpFrom = 'title'; scene = 'help'; }
  } else if (scene === 'over') {
    if (go && real > lock) { reset(); scene = 'play'; }
    else if (hit.has('Escape')) scene = 'title';
  } else if (scene === 'perk') {
    if (real < lock) return;
    if (hit.has('ArrowLeft') || hit.has('KeyA')) perkSel = (perkSel + 2) % 3;
    if (hit.has('ArrowRight') || hit.has('KeyD')) perkSel = (perkSel + 1) % 3;
    if (hit.has('Digit1') || hit.has('Numpad1')) choosePerk(0);
    else if (hit.has('Digit2') || hit.has('Numpad2')) choosePerk(1);
    else if (hit.has('Digit3') || hit.has('Numpad3')) choosePerk(2);
    else if (hit.has('Enter') || hit.has('Space')) choosePerk(perkSel);
  }
  if (hit.has('KeyP') || hit.has('Escape')) {
    if (scene === 'play') scene = 'pause'; else if (scene === 'pause') scene = 'play';
  }
  if (scene === 'pause' && hit.has('KeyH')) { helpPage = 0; helpFrom = 'pause'; scene = 'help'; return; }
  if (hit.has('KeyM')) muted = !muted;
  if (hit.has('KeyL')) setLang(lang === 'ru' ? 'en' : 'ru');
}
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; real += dt;
  menuInput(); hit.clear();
  if (scene === 'play') update(dt);
  else if (scene === 'over') { for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; } parts = parts.filter(p => p.life > 0); shake = Math.max(0, shake - dt * 22); redFlash = Math.max(0, redFlash - dt); banner = 0; noticeT = 0; }
  render();
  requestAnimationFrame(frame);
}
function fit() {
  const s = Math.min(innerWidth / 1000, innerHeight / 780, 1.6);
  document.getElementById('stage').style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
addEventListener('resize', fit); fit();
reset(); cv.focus();
window.__game = {
  get scene() { return scene; }, get P() { return P; }, get enemies() { return enemies; }, get wave() { return wave; }, get score() { return score; },
  get top() { return topList; }, get nick() { return nick; }
};
requestAnimationFrame(frame);
})();
</script>
